spring.datasource.url=jdbc:mysql://localhost:3306/airline_test?createDatabaseIfNotExist=true

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Build the schema fresh for each test run, drop it afterwards
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.hikari.maximum-pool-size=15

app.admin.username=adminTest
app.admin.email=adminTest@airline.local
app.admin.password=test-admin-password

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Flights</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      .avatar-lg {
        width: 3.5rem;
        height: 3.5rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container mb-5">
      <!--Info card-->
      <div class="card shadow-sm mb-3">
        <div class="card-body d-flex align-items-center gap-3">
          <span
            class="avatar-lg rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fs-4 fw-semibold flex-shrink-0"
            th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}"
            >U</span
          >
          <div class="flex-grow-1">
            <h1 class="h5 mb-0" th:text="${user.name}">Full name</h1>
            <div class="small text-muted text-break">
              <span th:text="${user.username}">@username</span>
              &middot;
              <span th:text="${user.userEmail}">user@user.com</span>
            </div>
          </div>

          <span
            class="badge ms-auto"
            th:with="isAdmin=${user.role.name() == 'ADMIN'}"
            th:classappend="${isAdmin} ? 'text-bg-dark' : 'text-bg-light border'"
            th:text="${isAdmin} ? 'Admin' : 'User' "
          >
            User
          </span>
        </div>
      </div>

      <!--Stat card-->
      <div class="row g-3 mb-3">
        <!--total bookings-->
        <div class="col-12 col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Total bookings</div>
              <div class="fs-4 fw-semibold" th:text="${totalBookings}">5</div>
            </div>
          </div>
        </div>

        <!--Upcoming flight-->
        <div class="col-12 col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Upcoming Flight</div>
              
              <div th:if="${earliestFlight != null}" th:with="datetime = ${earliestFlight.departureTime}" class="fs-4 fw-semibold">
                <div th:text="${earliestFlight.flightNumber}" class="fs-5 fw-semibold">KL123</div>
                <div th:text="${#temporals.format(datetime, 'dd MMM, HH:mm')}" class="fs-5 fw-semibold">01 Jan, 2026</div>
              </div>

              <div th:unless="${earliestFlight != null}" class="fs-4 fw-semibold">There is no upcoming flight</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

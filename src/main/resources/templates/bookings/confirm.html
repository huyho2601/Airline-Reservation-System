<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .circle {
        width: 1.5rem;
        height: 1.5rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container">
      <a
        th:href="@{/flights/{fn}(fn=${flight.flightNumber})}"
        class="btn btn-link px-0 mb-3"
      >
        &larr; Back to seat selection
      </a>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div
            class="d-flex justify-content-between align-items-start flex-wrap gap-2"
          >
            <div>
              <h1 class="h3 mb-1">Review Your Booking</h1>
              <p>Check the details, then confirm</p>
            </div>
          </div>

          <hr />

          <div class="d-flex align-items-start gap-3">
            <span
              class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0 text-primary-emphasis small fw-semibold circle"
              >1</span
            >
            <div class="flex-grow-1">
              <div>
                <h5 th:text="${flight.flightNumber}"></h5>
                <div>
                  <span th:text="${flight.origin}">Origin</span>
                  &rarr;
                  <span th:text="${flight.destination}">Destination</span>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-6">
                  <div class="small text-muted">Departure:</div>
                  <div
                    th:text="${#temporals.format(flight.departureTime, 'dd MMM yyyy, HH:mm')}"
                    class="fw-semibold"
                  ></div>
                </div>

                <div class="col-6">
                  <div class="small text-muted">Arrival:</div>
                  <div
                    th:text="${#temporals.format(flight.arrivalTime, 'dd MMM yyyy, HH:mm')}"
                    class="fw-semibold"
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <hr />

          <div class="d-flex align-items-center gap-3">
            <span
              class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0 text-primary-emphasis small fw-semibold circle"
              >2</span
            >

            <div class="flex-grow-1 d-flex align-items-center">
              <p class="text-muted small mb-0"
              th:text="${bookingId == null} ? 'Your seat' : 'Your new seat'">Your seat</p>

              <span
                th:text="${seat.seatNumber}"
                class="badge bg-success-subtle text-success-emphasis fs-5 px-3 py-2 ms-auto"
              >12A</span>
            </div>
          </div>

          <hr />

          <div class="d-flex align-items-start gap-3">
            <span
              class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0 text-primary-emphasis small fw-semibold circle"
              >3</span
            >
            <div class="flex-grow-1">
              <h5 class="mb-0">
                Passenger
                <span
                  class="badge text-bg-light border fw-normal ms-2 align-middle"
                  >From your account</span
                >
              </h5>

              <div class="row g-2 mt-2">
                <div class="col-12 col-sm-4">
                  <div class="small text-muted">Full name</div>
                  <div th:text="${user.name}" class="fw-semibold"></div>
                </div>

                <div class="col-12 col-sm-4">
                  <div class="small text-muted">Email</div>
                  <div
                    th:text="${user.userEmail}"
                    class="fw-semibold text-break"
                  ></div>
                </div>

                <div class="col-12 col-sm-4">
                  <div class="small text-muted">Username</div>
                  <div th:text="${user.username}" class="fw-semibold"></div>
                </div>
              </div>
            </div>
          </div>

          <hr />

          <div class="d-flex align-items-center gap-3">
            <span
              class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0 text-primary-emphasis small fw-semibold circle"
              >4</span
            >

            <div class="flex-grow-1 d-flex align-items-center">
              <p class="text-muted small mb-0">Total price</p>

              <span
                th:text="'€' + ${#numbers.formatDecimal(flight.price, 1, 2)}"
                class="fw-semibold fs-3 ms-auto"
              >149</span>
            </div>
          </div>

          <hr />

          <div class="d-flex align-items-center gap-3">
            <span
              class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle flex-shrink-0 text-primary-emphasis small fw-semibold circle"
              >5</span
            >

            <form th:action="@{/flights/{fn}/book(fn=${flight.flightNumber})}" method="post" class="flex-grow-1">
              <input type="hidden" name="seat" th:value="${seat.seatNumber}">
              <input type="hidden" name="bookingId" th:value="${bookingId}">
              <button type="submit" class=" btn btn-primary w-100">
              Confirm booking
            </button>
            </form>
            
            <a th:href="@{/flights/{fn}(fn=${flight.flightNumber})}" class="btn btn-outline-secondary">Cancel</a>
          </div>




        </div>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .circle {
        width: 1.5rem;
        height: 1.5rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container">
      <h1 th:text="${name}" class="h4 mb-3">bookings</h1>

      <div
        th:if="${success}"
        th:text="${success}"
        class="alert alert-success"
      ></div>

      <div th:if="${#lists.isEmpty(bookings)}" class="card shadow-sm">
        <div class="card-body text-center text-muted">
          This user hasn't booked any flights yet.
          <a th:href="@{/admin/users}">Manage users</a>
        </div>
      </div>

      <div th:each="booking : ${bookings}" class="card shadow-sm mb-3">
        <div class="card-body">
          <div
            th:replace="~{fragments/booking :: summary(${booking.seat.flight}, ${booking.seat}, ${booking.id}, ${isAdmin})}"
          ></div>
        </div>
      </div>
    </main>
  </body>
</html>

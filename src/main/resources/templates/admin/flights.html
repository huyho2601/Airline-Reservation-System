<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Flights</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Manage flights</h1>
        <a th:href="@{/admin/flights/new}" class="btn btn-primary">
          <i class="bi bi-plus-lg me-1"></i> Add flight
        </a>
      </div>

      <!--Messages-->
      <div
        th:if="${success}"
        th:text="${success}"
        class="alert alert-success"
      ></div>
      <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>

      <div class="card shadow-sm">
        <div class="card-body">
          <!--Filter bar-->
          <form th:action="@{/admin/flights}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md">
              <input
                type="search"
                name="flightNumber"
                th:value="${flightNumber}"
                class="form-control"
                placeholder="Search flight number"
              />
            </div>

            <div class="col-8 col-md-3">
              <select name="filter" class="form-select">
                <option value="all" th:selected="${filter == 'all'}">
                  All
                </option>
                <option value="upcoming" th:selected="${filter == 'upcoming'}">
                  Upcoming
                </option>
                <option value="past" th:selected="${filter == 'past'}">
                  Past
                </option>
              </select>
            </div>

            <div class="col-4 col-md-auto">
              <button type="submit" class="btn btn-outline-secondary w-100">
                <i class="bi bi-funnel me-1"></i>Filter
              </button>
            </div>
          </form>

          <p
            th:if="${#lists.isEmpty(rows)}"
            class="text-muted text-center my-4"
          >
            No flights match your search.
          </p>

          <!--Flights table-->
          <div th:unless="${#lists.isEmpty(rows)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Flight</th>
                <th>Route</th>
                <th>Departure</th>
                <th class="text-end">Price</th>
                <th style="width: 10rem;">Seats</th>
                <th class="text-end">Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="row: ${rows}"
                th:with="flight=${row.flight},
                percent=${row.totalSeats > 0 ? row.bookedSeats * 100 / row.totalSeats : 0}">

                <td class="fw-semibold" th:text="${flight.flightNumber}">KL1234</td>

                <td>
                  <span th:text="${flight.origin}">AMS</span>
                  &rarr;
                  <span th:text="${flight.destination}">LHR</span>
                </td>
                
                 <td th:text="${#temporals.format(flight.departureTime, 'dd MMM yyyy, HH:mm')}">01 Dec 2026, 10:00</td>
 
                <td class="text-end" th:text="'€' + ${#numbers.formatDecimal(flight.price, 1, 2)}">€149.00</td>

                <td>
                  <div class="small mb-1" th:text="${row.bookedSeats} + ' / ' + ${row.totalSeats}">18 / 24</div>
                  <div class="progress" style="height: 6px;" role="progressbar"
                       aria-valuemin="0" aria-valuemax="100" th:aria-valuenow="${percent}">
                    <div class="progress-bar"
                         th:classappend="${percent >= 100} ? 'bg-danger'"
                         th:style="'width: ' + ${percent} + '%'"></div>
                  </div>
                </td>

                <td class="text-end text-nowrap">
                  <a th:href="@{/admin/flights/{fn}/edit(fn=${flight.flightNumber})}"
                     class="btn btn-sm btn-outline-secondary" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </a>
 
                  <form th:action="@{/admin/flights/{fn}/delete(fn=${flight.flightNumber})}"
                        method="post" class="d-inline"
                        th:data-name="${flight.flightNumber}"
                        onsubmit="return confirm('Delete flight ' + this.dataset.name + '?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </td>

                </tr>
              </tbody>

            </table>
          </div>

        </div>
      </div>
    </main>
  </body>
</html>

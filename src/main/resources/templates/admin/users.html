<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      .avatar {
        width: 2rem;
        height: 2rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container mb-5">
      <h1 class="h4 mb-3">Manage users</h1>

      <div
        th:if="${success}"
        th:text="${success}"
        class="alert alert-success"
      ></div>
      <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>

      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Users</div>
              <div class="fs-4 fw-semibold" th:text="${userCount}">128</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Admins</div>
              <div class="fs-4 fw-semibold" th:text="${adminCount}">3</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <div class="small text-muted">Bookings</div>
              <div class="fs-4 fw-semibold" th:text="${bookingCount}">412</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Filter bar -->
          <form th:action="@{/admin/users}" method="get" class="row g-2 mb-3">
            <div class="col-12 col-md">
              <input
                type="search"
                name="value"
                th:value="${value}"
                class="form-control"
                placeholder="Search user by name or username"
              />
            </div>

            <div class="col-8 col-md-3">
              <select name="role" class="form-select">
                <option value="" th:selected="${role == null or role == ''}">
                  All roles
                </option>
                <option value="CLIENT" th:selected="${role == 'CLIENT'}">
                  Users
                </option>
                <option value="ADMIN" th:selected="${role == 'ADMIN'}">
                  Admins
                </option>
              </select>
            </div>

            <div class="col-4 col-md-auto">
              <button type="submit" class="btn btn-outline-secondary w-100">
                <i class="bi bi-funnel me-1"></i>Filter
              </button>
            </div>
          </form>

          <p
            th:if="${#lists.isEmpty(rows)}"
            class="text-muted text-center my-4"
          >
            No users match your search.
          </p>

          <div th:unless="${#lists.isEmpty(rows)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th class="text-end">Bookings</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr
                  th:each="row : ${rows}"
                  th:with="user=${row.user},
                           isAdmin=${user.role.name() == 'ADMIN'},
                           isMe=${user.username == #authentication.name}"
                >
                  <!-- Avatar + name + username -->
                  <td>
                    <div class="d-flex align-items-center">
                      <span
                        class="avatar rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-semibold small me-2 flex-shrink-0"
                        th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}"
                        >U</span
                      >
                      <div>
                        <div class="fw-semibold" th:text="${user.name}">
                          User 1
                        </div>
                        <div
                          class="small text-muted"
                          th:text="${user.username}"
                        >
                          user
                        </div>
                      </div>
                    </div>
                  </td>

                  <td class="text-break" th:text="${user.userEmail}">
                    test@mail.com
                  </td>

                  <td>
                    <span
                      class="badge"
                      th:classappend="${isAdmin} ? 'text-bg-dark' : 'text-bg-light border'"
                      th:text="${isAdmin} ? 'Admin' : 'User'"
                      >Role</span
                    >
                  </td>

                  <td class="text-end" th:text="${row.totalBookings}">2</td>

                  <td class="text-end text-nowrap">
                    <span th:if="${isMe}" class="small text-muted">You</span>

                    <th:block th:unless="${isMe}">
                      <a
                        th:href="@{/admin/users/bookings/{username}(username=${user.username})}"
                        class="btn btn-sm btn-outline-secondary"
                        title="Edit"
                      >
                        <i class="bi bi-eye-fill"></i>
                      </a>

                      <form
                        th:action="@{/admin/users/{id}/role(id=${user.id})}"
                        method="post"
                        class="d-inline"
                      >
                        <input
                          type="hidden"
                          name="role"
                          th:value="${isAdmin} ? 'CLIENT' : 'ADMIN'"
                        />
                        <button
                          type="submit"
                          class="btn btn-sm btn-outline-secondary"
                          th:title="${isAdmin} ? 'Remove admin' : 'Make admin'"
                        >
                          <i
                            class="bi"
                            th:classappend="${isAdmin} ? 'bi-person-down' : 'bi-person-up'"
                          ></i>
                        </button>
                      </form>

                      <!-- Delete -->
                      <form
                        th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                        method="post"
                        class="d-inline"
                        th:data-name="${user.username}"
                        onsubmit="
                          return confirm(
                            'Delete user ' + this.dataset.name + '?',
                          );
                        "
                      >
                        <button
                          type="submit"
                          class="btn btn-sm btn-outline-danger"
                          title="Delete"
                        >
                          <i class="bi bi-trash"></i>
                        </button>
                      </form>
                    </th:block>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

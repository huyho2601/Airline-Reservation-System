<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Flights</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-3">
              <h1 class="h5 mb-4">Add flight form</h1>

              <form
               th:action="@{/admin/flights/new}" th:object="${form}" method="post"
              >
                <div class="row d-flex align-content-center">
                  <div class="col-12 col-md-4 mb-3">
                    <label class="form-label">Flight Number</label>
                    <input
                      th:field="*{flightNumber}"
                      type="text"
                      class="form-control"
                    />
                  </div>

                  <div class="col-12 col-md-4 mb-3">
                    <label class="form-label">Price</label>
                    <input
                      th:field="*{price}"
                      type="text"
                      step="0.01"
                      min="0"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-12 col-md-4 mb-3">
                    <label class="form-label">Flight Number</label>
                    <input
                      th:field="*{totalSeats}"
                      type="text"
                      class="form-control"
                      min="0"
                    />
                  </div>
                </div>

                <div class="row d-flex align-content-center">
                  <div class="col-12 col-md-6 mb-3">
                    <label class="form-label">Origin</label>
                    <input
                      th:field="*{origin}"
                      type="text"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-12 col-md-6 mb-3">
                    <label class="form-label">Destination</label>
                    <input
                      th:field="*{destination}"
                      type="text"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="row d-flex align-content-center">
                  <div class="col-12 col-md-6 mb-3">
                    <label class="form-label">Departure</label>
                    <input
                      th:field="*{departureTime}"
                      type="datetime-local"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-12 col-md-6 mb-3">
                    <label class="form-label">Arrival</label>
                    <input
                      th:field="*{arrivalTime}"
                      type="datetime-local"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <button type="submit" class="btn btn-primary">
                  Save flight
                </button>

                <a th:href="@{/admin/flights}" class="btn btn-secondary"
                  >Cancel</a
                >
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Airline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Airline</a>

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/flights}">Flights</a>
        </li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/bookings/my}">My Bookings</a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/flights}">Manage Flights</a>
        </li>

        <!--guests-->
        <div sec:authorize="!isAuthenticated()">
          <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
          <a class="btn btn-outline btn-sm" th:href="@{/register}">Register</a>
        </div>

        <!--logged-in user-->
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" 
        class="d-flex align-items-center gap-2 mb-0">
            <span class="navbar-text" sec:authentication="principal.realName">user</span>
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      </ul>
    </div>
  </nav>
</body>
</html>

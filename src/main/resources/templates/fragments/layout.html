<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Airline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">✈ Airline</a>

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/flights}">Flights</a>
        </li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/bookings/my}">My Bookings</a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/flights}">Manage Flights</a>
        </li>
      </ul>

      <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
        <a class="btn btn-light btn-sm" th:href="@{/register}">Register</a>
      </div>

      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"
            class="d-flex align-items-center gap-2 mb-0">
        <span class="navbar-text text-white" sec:authentication="principal.realName">user</span>
        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
      </form>
    </div>
  </nav>
</body>
</html>

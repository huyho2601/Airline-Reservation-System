<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Register</h1>

            <form th:action="@{/register}" th:object="${form}" method="post">
              <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
              </div>

              <div class="mb-3">
                <label class="form-label" for="fullName">Full Name</label>
                <input th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                       type="text" class="form-control"
                       placeholder="Enter your full name" required autofocus>
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       type="email" class="form-control"
                       placeholder="Enter your email" required>
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                       type="text" class="form-control"
                       placeholder="Enter your username" required>
                <div class="invalid-feedback" th:errors="*{username}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       type="password" class="form-control"
                       placeholder="Enter your password" required>
                <div class="invalid-feedback" th:errors="*{password}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       type="password" class="form-control"
                       placeholder="Enter your password again" required>
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
          </div>
        </div>

        <p class="text-center text-muted mt-3">
          Already have an account with us? <a th:href="@{/login}">Sign in</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

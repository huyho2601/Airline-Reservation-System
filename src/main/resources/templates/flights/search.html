<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Search Flights</title>
  </head>

  <body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container my-4">
      <form
        th:action="@{/flights}"
        method="get"
        class="row g-3 align-items-end"
      >
        <div class="sm:col-3">
          <label class="form-label" for="origin">From:</label>
          <input
            class="form-control"
            name="origin"
            id="origin"
            th:value="${origin}"
            required
          />
        </div>

        <div class="sm:col-3">
          <label class="form-label" for="destination">To:</label>
          <input
            class="form-control"
            name="destination"
            id="destination"
            th:value="${destination}"
            required
          />
        </div>

        <div class="sm:col-2">
          <label class="form-label" for="fromDate">Start:</label>
          <input
            class="form-control"
            name="fromDate"
            id="fromDate"
            type="date"
            th:value="${fromDate}"
            required
          />
        </div>

        <div class="sm:col-2">
          <label class="form-label" for="toDate">End:</label>
          <input
            class="form-control"
            name="toDate"
            id="toDate"
            type="date"
            th:value="${toDate}"
            required
          />
        </div>

        <div class="sm:col-2">
          <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
      </form>

      <div
        th:if="${error}"
        class="alert alert-danger mt-3"
        th:text="${error}"
      ></div>

      <div th:if="${flights != null}" class="mt-4">
        <p th:if="${#lists.isEmpty(flights)}">No fligths found</p>
        <table th:unless="${#lists.isEmpty(flights)}" class="table">
          <td>Flight Number</td>
          <td>Origin</td>
          <td>Destination</td>
          <td>Departure Time</td>
          <td>Arrival Time</td>
          <td>Price</td>
          <td>Select Seat</td>
          <tr th:each="flight:${flights}">
            <td th:text="${flight.flightNumber}"></td>
            <td th:text="${flight.origin}"></td>
            <td th:text="${flight.destination}"></td>
            <td th:text="${flight.departureTime}"></td>
            <td th:text="${flight.arrivalTime}"></td>
            <td th:text="${flight.price}"></td>
            <td>
              <a
                th:href="@{/flights/{n}(n=${flight.flightNumber})}"
                class="btn btn-primary"
                >Select Seat</a
              >
            </td>
          </tr>
        </table>
      </div>
    </main>
  </body>
</html>

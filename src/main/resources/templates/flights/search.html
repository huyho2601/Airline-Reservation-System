<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Flights</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="container">

    <!-- Search form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h4 mb-3">Search flights</h1>

        <form th:action="@{/flights}" method="get" class="row g-3 align-items-end">
          <div class="col-12 col-md-3">
            <label class="form-label" for="origin">From</label>
            <input class="form-control" name="origin" id="origin"
                   th:value="${origin}" placeholder="e.g. AMS" required>
          </div>

          <div class="col-12 col-md-3">
            <label class="form-label" for="destination">To</label>
            <input class="form-control" name="destination" id="destination"
                   th:value="${destination}" placeholder="e.g. LHR" required>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label" for="fromDate">Start</label>
            <input class="form-control" name="fromDate" id="fromDate" type="date"
                   th:value="${fromDate}" required>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label" for="toDate">End</label>
            <input class="form-control" name="toDate" id="toDate" type="date"
                   th:value="${toDate}" required>
          </div>

          <div class="col-12 col-md-2">
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </div>
        </form>
      </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Results -->
    <div th:if="${flights != null}" class="card shadow-sm mb-5">
      <div class="card-body">
        <p th:if="${#lists.isEmpty(flights)}" class="text-muted mb-0">No flights found.</p>

        <div th:unless="${#lists.isEmpty(flights)}" class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Flight</th>
                <th>Origin</th>
                <th>Destination</th>
                <th>Departure</th>
                <th>Arrival</th>
                <th>Price</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="flight : ${flights}">
                <td class="fw-semibold" th:text="${flight.flightNumber}"></td>
                <td th:text="${flight.origin}"></td>
                <td th:text="${flight.destination}"></td>
                <td th:text="${#temporals.format(flight.departureTime, 'dd MMM yyyy, HH:mm')}"></td>
                <td th:text="${#temporals.format(flight.arrivalTime, 'dd MMM yyyy, HH:mm')}"></td>
                <td th:text="${flight.price}"></td>
                <td class="text-end">
                  <a th:href="@{/flights/{n}(n=${flight.flightNumber})}"
                     class="btn btn-primary btn-sm">Select seat</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Flight ' + ${flight.flightNumber}">Flight details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .seat {
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      font-size: .8rem;
    }
    .aisle {
      width: 1.5rem;
    }
    .row-label {
      width: 2rem;
    }
  </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container">

  <a th:href="@{/flights}" class="btn btn-link px-0 mb-3">&larr; Back to search</a>

  <!-- Flight summary -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <h1 class="h3 mb-1" th:text="${flight.flightNumber}">KL1234</h1>
          <p class="text-muted mb-0">
            <span th:text="${flight.origin}">AMS</span>
            &rarr;
            <span th:text="${flight.destination}">LHR</span>
          </p>
        </div>
      </div>

      <hr>

      <div class="row text-center">
        <div class="col">
          <div class="text-muted small">Departure</div>
          <div class="fw-semibold"
               th:text="${#temporals.format(flight.departureTime, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 10:00</div>
        </div>
        <div class="col">
          <div class="text-muted small">Arrival</div>
          <div class="fw-semibold"
               th:text="${#temporals.format(flight.arrivalTime, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 11:15</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Seat map -->
  <div class="card shadow-sm mb-5">
    <div class="card-body">
      <h2 class="h5 mb-3">Choose a seat</h2>

      <!-- Legend -->
      <div class="d-flex gap-3 mb-4 small">
        <span><span class="badge bg-success">&nbsp;</span> Available</span>
        <span><span class="badge bg-warning">&nbsp;</span> Reserved</span>
        <span><span class="badge bg-secondary">&nbsp;</span> Booked</span>
      </div>

      <div th:if="${#maps.isEmpty(seatMap)}" class="alert alert-info">
        No seats configured for this flight.
      </div>

      <div class="d-flex flex-column align-items-center gap-2">
        <div th:each="entry : ${seatMap}" class="d-flex align-items-center gap-1">

          <span class="row-label text-muted small text-end me-2" th:text="${entry.key}">1</span>

          <th:block th:each="seat, stat : ${entry.value}">
            <!-- Aisle gap in the middle of the row -->
            <span th:if="${stat.index == stat.size / 2}" class="aisle"></span>

            <th:block th:switch="${seat.status.name()}">
              <a th:case="'AVAILABLE'"
                 th:href="${changeBooking == null}
                 ? @{/flights/{fn}/book(fn=${flight.flightNumber}, seat=${seat.seatNumber})}
                 : @{/flights/{fn}/book(fn=${flight.flightNumber}, seat=${seat.seatNumber}, bookingId=${changeBooking.id})}"
                 class="btn btn-success seat"
                 th:text="${seat.seatNumber}">1A</a>

              <button th:case="'RESERVED'" type="button" class="btn btn-warning seat" disabled
                      th:text="${seat.seatNumber}">1B</button>

              <button th:case="*" type="button" class="btn btn-secondary seat" disabled
                      th:text="${seat.seatNumber}">1C</button>
            </th:block>
          </th:block>
        </div>
      </div>
    </div>
  </div>

</main>

</body>
</html>
